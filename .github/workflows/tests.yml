name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install .
      - run: python -m pytest -q
      - run: python -m ruff check --select E4,E7,E9,F,I .
      - run: ssm-bridge --help
      - run: python -m compileall -q cli.py mcp_server.py ssm_bridge.py ssm_setup.py
